PACKAGE_NAME="gpu-unlock"
PACKAGE_VERSION="1.0.0"
BUILT_MODULE_NAME[0]="gpu_unlock"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
# Build for each kernel instead of letting RHEL's weak-modules link one
# kernel's build into the others: removing the package then leaves links
# behind that break dracut for those kernels.
NO_WEAK_MODULES="yes"
BUILD_EXCLUSIVE_CONFIG="CONFIG_PCI CONFIG_FW_LOADER"
# linux/aperture.h is 6.0+. Skip older kernels whose headers are still
# installed (Ubuntu 22.04 builds for all of them) instead of failing the
# package install. A regex, not BUILD_EXCLUSIVE_KERNEL_MIN: dkms 2.8 on
# 22.04 ignores that.
BUILD_EXCLUSIVE_KERNEL="^([6-9]|[1-9][0-9]+)\."
MAKE[0]="make KDIR=${kernel_source_dir}"
