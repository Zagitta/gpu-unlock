<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0d0b"/>
      <stop offset="1" stop-color="#132a12"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a8f00"/>
      <stop offset="1" stop-color="#9be22d"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="16" fill="url(#grid)"/>

  <text x="64" y="128" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-2">gpu<tspan fill="#76b900">-</tspan>unlock</text>
  <text x="66" y="178" font-size="28" fill="#d6e6c8">Full-speed tensor cores for GeForce RTX</text>
  <text x="66" y="214" font-size="20" fill="#8fa386">Up to 2× FP16 / BF16 / TF32 · Linux kernel module · stock NVIDIA driver</text>

  <g font-size="17" font-weight="600">
    <rect x="66" y="246" width="96" height="34" rx="17" fill="#76b900" fill-opacity="0.16" stroke="#76b900"/>
    <text x="114" y="269" text-anchor="middle" fill="#b6ef5c">RTX 20</text>
    <rect x="174" y="246" width="96" height="34" rx="17" fill="#76b900" fill-opacity="0.16" stroke="#76b900"/>
    <text x="222" y="269" text-anchor="middle" fill="#b6ef5c">RTX 30</text>
    <rect x="282" y="246" width="96" height="34" rx="17" fill="#76b900" fill-opacity="0.16" stroke="#76b900"/>
    <text x="330" y="269" text-anchor="middle" fill="#b6ef5c">RTX 40</text>
  </g>

  <g transform="translate(760 72)">
    <text x="0" y="0" font-size="16" font-weight="600" fill="#8fa386" letter-spacing="1.5">BF16 MATMUL · TFLOPS</text>

    <text x="0" y="44" font-size="18" font-weight="700" fill="#ffffff">RTX 3090 Ti</text>
    <rect x="0" y="56" width="207" height="18" rx="4" fill="#3a4a38"/>
    <text x="217" y="71" font-size="16" fill="#8fa386">88 stock</text>
    <rect x="0" y="80" width="369" height="18" rx="4" fill="url(#hot)"/>
    <text x="379" y="95" font-size="16" font-weight="700" fill="#b6ef5c">157</text>

    <text x="0" y="140" font-size="18" font-weight="700" fill="#ffffff">RTX 4080</text>
    <rect x="0" y="152" width="244" height="18" rx="4" fill="#3a4a38"/>
    <text x="254" y="167" font-size="16" fill="#8fa386">104 stock</text>
    <rect x="0" y="176" width="454" height="18" rx="4" fill="url(#hot)"/>
    <text x="464" y="191" font-size="16" font-weight="700" fill="#b6ef5c">193</text>
  </g>
</svg>
