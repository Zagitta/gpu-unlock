<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">gpu-unlock 3.0 — Beyond full-speed tensors</title>
  <desc id="desc">Up to twice the FP16, BF16 and TF32 tensor throughput. Release 3.0 adds PCIe P2P, ECC, VRAM temperatures, HBM power management and CMP 170HX support. Linux kernel module with the stock NVIDIA driver.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#090f12"/>
      <stop offset="1" stop-color="#11261b"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#9bea38" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#9bea38" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="green" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#76b900"/>
      <stop offset="1" stop-color="#cbff84"/>
    </linearGradient>
    <linearGradient id="die" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#243e2d"/>
      <stop offset="1" stop-color="#101b19"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b6e8d0" stroke-opacity="0.045"/>
    </pattern>
    <pattern id="pins" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M5 0V18" stroke="#73936c" stroke-width="5"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="400" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#grid)"/>
    <ellipse cx="1000" cy="154" rx="340" ry="280" fill="url(#halo)"/>
    <path d="M0 0H1280" stroke="url(#green)" stroke-width="6"/>

    <!-- Circuit traces connect the two dies: peer-to-peer. -->
    <g fill="none" stroke="#8dc85b" stroke-opacity="0.3" stroke-width="2">
      <path d="M766 111H820L856 147H902M766 135H810L846 171H902M766 159H800L836 195H902"/>
      <path d="M1110 119H1156L1196 79H1280M1110 143H1170L1210 103H1280M1110 167H1184L1224 127H1280"/>
      <path d="M1000 52V22H1136M1000 260V286H1190L1230 246H1280"/>
    </g>
    <g fill="#a1e457">
      <circle cx="820" cy="111" r="3"/><circle cx="810" cy="135" r="3"/>
      <circle cx="1196" cy="79" r="3"/><circle cx="1210" cy="103" r="3"/>
      <circle cx="1136" cy="22" r="3"/><circle cx="1190" cy="286" r="3"/>
    </g>

    <rect x="60" y="35" width="144" height="30" rx="15" fill="#a4ed52"/>
    <text x="132" y="56" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="1" fill="#12200f">RELEASE 3.0</text>
    <text x="220" y="56" font-size="14" font-weight="600" letter-spacing="2" fill="#91a79d">LINUX · STOCK NVIDIA DRIVER</text>

    <text x="56" y="152" font-size="84" font-weight="800" fill="#f6fff7" letter-spacing="-3">gpu<tspan fill="#a4ed52">-</tspan>unlock</text>
    <text x="60" y="202" font-size="32" font-weight="600" fill="#e0eddf">Beyond full-speed tensors.</text>
    <text x="60" y="248" font-size="19" fill="#9cb2a4">FP16 / BF16 / TF32 · RTX 20 / 30 / 40 + CMP 170HX</text>

    <rect x="720" y="83" width="56" height="94" rx="9" fill="#14251e" stroke="#618349"/>
    <rect x="731" y="94" width="34" height="72" rx="4" fill="url(#die)" stroke="#83b85a"/>
    <path d="M743 111V149M753 111V149" stroke="#a4ed52" stroke-width="3" opacity="0.6"/>
    <rect x="920" y="43" width="162" height="18" fill="url(#pins)"/>
    <rect x="920" y="253" width="162" height="18" fill="url(#pins)"/>
    <path d="M884 83H912M884 101H912M884 119H912M884 137H912M884 155H912M884 173H912M884 191H912M884 209H912M884 227H912M1092 83H1120M1092 101H1120M1092 119H1120M1092 137H1120M1092 155H1120M1092 173H1120M1092 191H1120M1092 209H1120M1092 227H1120" stroke="#73936c" stroke-width="5"/>
    <rect x="903" y="56" width="200" height="200" rx="22" fill="#0b1612" stroke="#50713e"/>
    <rect x="916" y="69" width="174" height="174" rx="13" fill="url(#die)" stroke="url(#green)" stroke-width="2"/>
    <path d="M930 95V83H942M1064 83H1076V95M930 217V229H942M1064 229H1076V217" fill="none" stroke="#a4ed52" stroke-width="2"/>
    <text x="1003" y="116" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="3" fill="#a2bd9b">UP TO</text>
    <text x="1000" y="188" text-anchor="middle" font-size="80" font-weight="800" letter-spacing="-4" fill="#c5ff85">2×</text>
    <text x="1003" y="218" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2" fill="#d3e6cd">TENSOR RATE</text>
    <g transform="translate(1072 35)">
      <circle cx="17" cy="22" r="30" fill="#a4ed52"/>
      <path d="M9 18V10A9 9 0 0 1 27 10" fill="none" stroke="#142511" stroke-width="4" stroke-linecap="round"/>
      <rect x="5" y="18" width="25" height="21" rx="4" fill="#142511"/>
      <path d="M17.5 25V31" stroke="#a4ed52" stroke-width="3" stroke-linecap="round"/>
    </g>

    <rect x="32" y="316" width="1216" height="60" rx="12" fill="#b6ef80" fill-opacity="0.06" stroke="#a4ed52" stroke-opacity="0.18"/>
    <g font-size="17" font-weight="700" fill="#dcebd5" text-anchor="middle">
      <text x="154" y="352" fill="#b7f573">PCIe P2P</text>
      <text x="397" y="352" fill="#b7f573">ECC</text>
      <text x="640" y="352">VRAM TEMPS</text>
      <text x="883" y="352">HBM POWER</text>
      <text x="1126" y="352">CMP 170HX</text>
    </g>
    <path d="M275 336V356M518 336V356M762 336V356M1005 336V356" stroke="#a4ed52" stroke-opacity="0.2"/>
  </g>
</svg>
