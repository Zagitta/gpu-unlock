# SPDX-License-Identifier: GPL-2.0-only
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The pinned NVIDIA inputs are fetched once per change of the list in
# fetch_artifacts.py into .inputs and shared by every job through the cache.
jobs:
  inputs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - id: cache
        uses: actions/cache@v4
        with:
          path: .inputs
          key: inputs-${{ hashFiles('firmware/fetch_artifacts.py') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: make inputs INPUTS=.inputs
      - name: Verify the inputs
        run: python3 firmware/fetch_artifacts.py --offline .inputs

  module:
    name: module (${{ matrix.image }})
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12     # 6.1
            setup: apt-get update -q && apt-get install -qy --no-install-recommends ca-certificates git
          - image: debian:13     # 6.12
            setup: apt-get update -q && apt-get install -qy --no-install-recommends ca-certificates git
          - image: ubuntu:22.04  # 5.15, 6.8 HWE
            setup: apt-get update -q && apt-get install -qy --no-install-recommends ca-certificates git
          - image: ubuntu:24.04  # 6.8, 7.0 HWE
            setup: apt-get update -q && apt-get install -qy --no-install-recommends ca-certificates git
          - image: ubuntu:26.04  # 7.0
            setup: apt-get update -q && apt-get install -qy --no-install-recommends ca-certificates git
          - image: fedora:43     # 7.2
            setup: dnf install -qy git
          - image: fedora:latest  # 7.2
            setup: dnf install -qy git
          - image: archlinux:latest  # 7.2, 6.18 LTS
            setup: pacman -Syu --noconfirm --needed git
          - image: opensuse/tumbleweed  # 7.2
            setup: zypper -n install git
    steps:
      # Without git the checkout is a GitHub archive, which leaves out
      # everything .gitattributes marks export-ignore, .github included.
      - run: ${{ matrix.setup }}
      - uses: actions/checkout@v5
      - run: sh .github/ci/module.sh

  package:
    name: package (${{ matrix.image }})
    needs: inputs
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            setup: apt-get update -q && apt-get install -qy --no-install-recommends ca-certificates git make xz-utils zstd
          - image: debian:13
            setup: apt-get update -q && apt-get install -qy --no-install-recommends ca-certificates git make xz-utils zstd
          - image: ubuntu:22.04
            setup: apt-get update -q && apt-get install -qy --no-install-recommends ca-certificates git make xz-utils zstd
          - image: ubuntu:24.04
            setup: apt-get update -q && apt-get install -qy --no-install-recommends ca-certificates git make xz-utils zstd
          - image: ubuntu:26.04
            setup: apt-get update -q && apt-get install -qy --no-install-recommends ca-certificates git make xz-utils zstd
          - image: fedora:43
            setup: dnf install -qy git make xz zstd rpm-build dnf-plugins-core
          - image: fedora:latest
            setup: dnf install -qy git make xz zstd rpm-build dnf-plugins-core
          - image: archlinux:latest
            setup: pacman -Syu --noconfirm --needed base-devel git zstd
          - image: opensuse/tumbleweed
            setup: zypper -n install git make xz zstd rpm-build
    steps:
      # git before the checkout, as above and so make dist and makepkg can
      # build HEAD; zstd before the cache restore, which needs it.
      - run: ${{ matrix.setup }}
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: .inputs
          key: inputs-${{ hashFiles('firmware/fetch_artifacts.py') }}
          fail-on-cache-miss: true
      - run: INPUTS=.inputs sh .github/ci/package.sh
      - run: sh tests/packaging/install.sh
