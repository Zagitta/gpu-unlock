# Put gpu_unlock and its firmware in every image and load it right before
# nvidia, so a display card's screen is blank only from its unlock until
# nvidia-drm takes over. Without nvidia in the image it loads last, still
# before any nvidia loaded from the root filesystem. Named to be read after
# every other drop-in. It does nothing unless gpu_unlock.targets= is on the
# kernel command line.
[[ ${MODULES@a} == *a* ]] || read -ra MODULES <<<"$MODULES"
# The systemd hook copies MODULES verbatim into /etc/modules-load.d/MODULES.conf,
# where kmod cannot resolve mkinitcpio's '?' optional-module suffix. Resolve the
# real entry here, and add nothing when the module is not built for this kernel
# so the image build still succeeds.
if modinfo -k "${KERNELVERSION:-$(uname -r)}" -F filename gpu_unlock >/dev/null 2>&1; then
    _gu_entry=gpu_unlock
else
    _gu_entry=
fi
_gu_modules=()
for _gu_module in "${MODULES[@]}"; do
    [[ ${_gu_module%\?} == gpu_unlock ]] && continue
    [[ -n $_gu_entry && ${_gu_module%\?} == nvidia ]] && _gu_modules+=("$_gu_entry")
    _gu_modules+=("$_gu_module")
done
[[ -n $_gu_entry && " ${_gu_modules[*]} " != *" $_gu_entry "* ]] && _gu_modules+=("$_gu_entry")
MODULES=("${_gu_modules[@]}")
unset _gu_modules _gu_module _gu_entry
