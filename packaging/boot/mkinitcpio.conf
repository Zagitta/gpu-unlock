# Include gpu_unlock and prepare its VBIOS overrides before module loading.
# Named to be read after other drop-ins. It does nothing unless
# gpu_unlock.targets= is on the kernel command line.
# The name is plain, not gpu_unlock?: the systemd hook copies MODULES as is
# into modules-load.d, which does not know the ?. A kernel without a build
# of the module gets nothing, so its image still builds.
if modinfo -k "$KERNELVERSION" gpu_unlock &>/dev/null; then
    [[ " ${HOOKS[*]} " == *' gpu-unlock-overrides '* ]] ||
        HOOKS=(gpu-unlock-overrides "${HOOKS[@]}")
    [[ ${MODULES@a} == *a* ]] || read -ra MODULES <<<"$MODULES"
    _gu_modules=()
    for _gu_module in "${MODULES[@]}"; do
        [[ ${_gu_module%\?} == gpu_unlock ]] && continue
        [[ ${_gu_module%\?} == nvidia ]] && _gu_modules+=(gpu_unlock)
        _gu_modules+=("$_gu_module")
    done
    [[ " ${_gu_modules[*]} " == *' gpu_unlock '* ]] || _gu_modules+=(gpu_unlock)
    MODULES=("${_gu_modules[@]}")
    unset _gu_modules _gu_module
fi
